name: CI - Pull Request Verification & Build

on:
  push:
    branches:
      - setup
      - main
  pull_request:
    branches:
      - main
      - setup
    paths:
      - 'app/**'
      - 'tests/**'
      - 'helm/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write
  security-events: write

jobs:
  lint-and-test:
    name: Lint, Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install -r tests/requirements-test.txt

      - name: Code Formatting & Lint Check
        run: |
          black --check app tests
          flake8 app tests --max-line-length=120 --extend-ignore=E203,W503

      - name: Run Unit & Integration Tests with Coverage
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ --cov=app --cov-report=term-missing --cov-report=xml

  dependency-security-scan:
    name: Dependency Vulnerability Scan (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Dependency Audit
        run: |
          pip install pip-audit
          pip-audit -r app/requirements.txt

  container-security-scan-and-build:
    name: Container Scan (Trivy) & Image Build
    runs-on: ubuntu-latest
    needs: [lint-and-test, dependency-security-scan]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # - name: Authenticate to Google Cloud via WIF
      #   uses: google-github-actions/auth@v2
      #   with:
      #     workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
      #     service_account: ${{ secrets.GCP_WIF_SA }}

      # - name: Configure Docker for Google Artifact Registry
      #   run: |
      #     gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: app/Dockerfile
          push: false
          load: true
          tags: |
            us-central1-docker.pkg.dev/gcp-cicd-staging/cr-usc1-test-app/test-app:${{ github.sha }}
            us-central1-docker.pkg.dev/gcp-cicd-staging/cr-usc1-test-app/test-app:latest

      - name: Run Trivy Container Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: us-central1-docker.pkg.dev/gcp-cicd-staging/cr-usc1-test-app/test-app:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  notify-on-failure:
    name: Failure Notification
    runs-on: ubuntu-latest
    needs: [lint-and-test, dependency-security-scan, container-security-scan-and-build]
    if: failure()

    steps:
      - name: Print Failure Alert
        run: |
          echo "::error::[CI PIPELINE FAILED] One or more CI checks (linting, tests, or security scans) failed for branch '${{ github.ref_name }}'."
