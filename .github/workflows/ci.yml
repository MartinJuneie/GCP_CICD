name: CI - Pull Request Verification & Build

on:
  push:
    branches:
      - setup
      - main
  pull_request:
    branches:
      - main
      - setup
    paths:
      - 'app/**'
      - 'tests/**'
      - 'helm/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write
  security-events: write

env:
  GAR_LOCATION: "us-central1"
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'gcp-cicd-staging' }}
  REPOSITORY: "cr-usc1-test-app"
  APP_NAME: "test-app"

jobs:
  lint-and-test:
    name: Lint, Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install -r tests/requirements-test.txt

      - name: Code Formatting & Lint Check
        run: |
          black --check app tests
          flake8 app tests --max-line-length=120 --extend-ignore=E203,W503

      - name: Run Unit & Integration Tests with Coverage
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ --cov=app --cov-report=term-missing --cov-report=xml

  dependency-security-scan:
    name: Dependency Vulnerability Scan (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Dependency Audit
        run: |
          pip install pip-audit
          pip-audit -r app/requirements.txt

  container-security-scan-and-push:
    name: Container Scan (Trivy) & Push to Artifact Registry
    runs-on: ubuntu-latest
    needs: [lint-and-test, dependency-security-scan]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image for Scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          file: app/Dockerfile
          push: false
          load: true
          tags: test-app:${{ github.sha }}

      - name: Run Trivy Container Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: test-app:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Google Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Push Container to Artifact Registry
        uses: docker/build-push-action@v5
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.APP_NAME }}:${{ github.sha }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.APP_NAME }}:latest

  notify-on-failure:
    name: Failure Notification
    runs-on: ubuntu-latest
    needs: [lint-and-test, dependency-security-scan, container-security-scan-and-push]
    if: failure()

    steps:
      - name: Print Failure Alert
        run: |
          echo "::error::[CI PIPELINE FAILED] One or more CI checks (linting, tests, or security scans) failed for branch '${{ github.ref_name }}'."

      # - name: Send Slack Notification
      #   if: env.SLACK_WEBHOOK != ''
      #   env:
      #     SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
      #   run: |
      #     curl -X POST -H 'Content-type: application/json' \
      #       --data '{"text":"🚨 *CI Pipeline Failed* on PR/Commit (`'"${{ github.ref_name }}"'`) by @'"${{ github.actor }}"'. Please check GitHub Actions logs."}' \
      #       ${{ secrets.SLACK_WEBHOOK_URL }} || echo "Slack notification sent or skipped"
