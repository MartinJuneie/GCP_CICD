name: CI - Verification, Build & Tagging

on:
  push:
    branches:
      - setup
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
      - setup
    paths:
      - 'app/**'
      - 'tests/**'
      - 'helm/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write
  security-events: write

jobs:
  lint-and-test:
    name: Lint, Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install -r tests/requirements-test.txt

      - name: Code Formatting & Lint Check
        run: |
          black --check app tests
          flake8 app tests --max-line-length=120 --extend-ignore=E203,W503

      - name: Run Unit & Integration Tests with Coverage
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ --cov=app --cov-report=term-missing --cov-report=xml

  dependency-security-scan:
    name: Dependency Vulnerability Scan (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Dependency Audit
        run: |
          pip install pip-audit
          pip-audit -r app/requirements.txt

  container-security-scan-and-push:
    name: Container Scan (Trivy) & Push to GAR
    runs-on: ubuntu-latest
    needs: [lint-and-test, dependency-security-scan]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 1: Build local image for vulnerability scanning
      - name: Build Local Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: app/Dockerfile
          push: false
          load: true
          tags: test-app:local

      # Step 2: Scan local image with Trivy (fails if CRITICAL/HIGH CVEs exist)
      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: test-app:local
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Step 3: Only runs if Trivy passes - Authenticate & Push to GAR
      # - name: Authenticate to Google Cloud via WIF
      #   uses: google-github-actions/auth@v2
      #   with:
      #     workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
      #     service_account: ${{ secrets.GCP_WIF_SA }}

      # - name: Configure Docker for Google Artifact Registry
      #   run: |
      #     gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # - name: Push Scanned Image to Artifact Registry
      #   run: |
      #     docker tag test-app:local us-central1-docker.pkg.dev/gcp-cicd-staging/cr-usc1-test-app/test-app:${{ github.sha }}
      #     docker tag test-app:local us-central1-docker.pkg.dev/gcp-cicd-staging/cr-usc1-test-app/test-app:${{ github.ref_name }}
      #     docker tag test-app:local us-central1-docker.pkg.dev/gcp-cicd-staging/cr-usc1-test-app/test-app:latest
      #     docker push us-central1-docker.pkg.dev/gcp-cicd-staging/cr-usc1-test-app/test-app:${{ github.sha }}
      #     docker push us-central1-docker.pkg.dev/gcp-cicd-staging/cr-usc1-test-app/test-app:${{ github.ref_name }}
      #     docker push us-central1-docker.pkg.dev/gcp-cicd-staging/cr-usc1-test-app/test-app:latest

  notify-on-failure:
    name: Failure Notification
    runs-on: ubuntu-latest
    needs: [lint-and-test, dependency-security-scan, container-security-scan-and-push]
    if: failure()

    steps:
      - name: Print Failure Alert
        run: |
          echo "::error::[CI PIPELINE FAILED] One or more CI checks (linting, tests, or security scans) failed for ref '${{ github.ref_name }}'."

      - name: Send Slack Failure Notification
        if: secrets.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "SLACK_WEBHOOK_URL secret not set. Skipping notification."
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg repo "$REPO" \
            --arg ref_type "$REF_TYPE" \
            --arg ref_name "$REF_NAME" \
            --arg commit "$COMMIT" \
            --arg actor "$ACTOR" \
            --arg url "$JOB_URL" \
            '{text: "*CI Pipeline Failed*\n• Repository: \($repo)\n• \($ref_type): `\($ref_name)`\n• Commit: `\($commit)`\n• Author: @\($actor)\n• Job URL: \($url)"}')

          curl -s -X POST -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK" || echo "Slack notification sent or skipped"
