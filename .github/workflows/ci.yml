name: CI - Pull Request Verification

on:
  push:
    branches:
      - setup
  pull_request:
    branches:
      - main
      - setup
    paths:
      - 'app/**'
      - 'tests/**'
      - 'helm/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  lint-and-test:
    name: Lint, Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install -r tests/requirements-test.txt

      - name: Code Formatting & Lint Check
        run: |
          black --check app tests
          flake8 app tests --max-line-length=120 --extend-ignore=E203,W503

      - name: Run Unit & Integration Tests with Coverage
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ --cov=app --cov-report=term-missing --cov-report=xml

  dependency-security-scan:
    name: Dependency Vulnerability Scan (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Dependency Audit
        run: |
          pip install pip-audit
          pip-audit -r app/requirements.txt

  container-security-scan:
    name: Container Build & Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [lint-and-test, dependency-security-scan]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: app/Dockerfile
          push: false
          load: true
          tags: test-app:${{ github.sha }}

      - name: Run Trivy Container Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: test-app:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  notify-on-failure:
    name: Failure Notification
    runs-on: ubuntu-latest
    needs: [lint-and-test, dependency-security-scan, container-security-scan]
    if: failure()

    steps:
      - name: Print Failure Alert
        run: |
          echo "::error::[CI PIPELINE FAILED] One or more CI checks (linting, tests, or security scans) failed for branch '${{ github.ref_name }}'."

      # - name: Send Slack Notification
      #   if: env.SLACK_WEBHOOK != ''
      #   env:
      #     SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
      #   run: |
      #     curl -X POST -H 'Content-type: application/json' \
      #       --data '{"text":"🚨 *CI Pipeline Failed* on PR/Commit (`'"${{ github.ref_name }}"'`) by @'"${{ github.actor }}"'. Please check GitHub Actions logs."}' \
      #       ${{ secrets.SLACK_WEBHOOK_URL }} || echo "Slack notification sent or skipped"
